<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接口跳转生成器</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #242836;
      --border: #2e3345;
      --text: #e8eaf0;
      --text-muted: #8b92a8;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --success: #4ade80;
      --error: #f87171;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 0.875rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn-row .btn { flex: 1; min-width: 120px; }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--text-muted);
    }

    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--error); }

    .config-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-radius: 8px;
      display: none;
    }

    .config-status.visible { display: block; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid transparent;
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    .btn-danger:hover { background: rgba(248, 113, 113, 0.1); }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast.success { border-color: var(--success); }
    #toast.error { border-color: var(--error); }

    .result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: var(--surface-2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .result-box.visible { display: block; }

    .result-url {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .endpoint-list {
      list-style: none;
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    .endpoint-item:last-child { border-bottom: none; }

    .endpoint-name {
      font-weight: 600;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
    }

    .endpoint-preview {
      color: var(--text-muted);
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }

    .endpoint-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 20px 0;
    }

    .token-toggle {
      position: relative;
    }

    .token-toggle input { padding-right: 70px; }

    .token-toggle button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .token-toggle button:hover { color: var(--text); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>接口跳转生成器</h1>
      <p>通过 GitHub Pages 部署纯文本接口，页面仅输出你指定的内容</p>
    </header>

    <!-- GitHub 配置 -->
    <div class="card">
      <h2>GitHub 配置</h2>
      <div class="row">
        <div class="field">
          <label for="gh-user">用户名</label>
          <input type="text" id="gh-user" value="lwei1992" autocomplete="off">
        </div>
        <div class="field">
          <label for="gh-repo">仓库名</label>
          <input type="text" id="gh-repo" value="app-gonow" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="gh-branch">分支</label>
          <input type="text" id="gh-branch" value="main" autocomplete="off">
          <p class="hint">GitHub Pages 通常使用 main 或 gh-pages 分支</p>
        </div>
        <div class="field token-toggle">
          <label for="gh-token">Personal Access Token</label>
          <input type="password" id="gh-token" autocomplete="off">
          <button type="button" id="toggle-token">显示</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-test">测试连接</button>
        <button class="btn btn-secondary" id="btn-init">初始化部署生成器</button>
        <button class="btn btn-ghost" id="btn-export">导出配置</button>
        <button class="btn btn-ghost" id="btn-import">导入配置</button>
      </div>
      <input type="file" id="import-file" accept=".json" hidden>
      <div class="config-status" id="config-status"></div>
    </div>

    <!-- 生成接口 -->
    <div class="card">
      <h2>生成接口</h2>
      <div class="field">
        <label for="ep-name">名字</label>
        <input type="text" id="ep-name" placeholder="Gmengtx" autocomplete="off">
        <p class="hint">将作为路径名，访问地址为 /名字/</p>
      </div>
      <div class="field">
        <label for="ep-content">显示内容</label>
        <textarea id="ep-content" placeholder="juxsne~0~https://www.baidu.com/"></textarea>
        <p class="hint">页面将仅输出此内容，不包含任何 HTML 标签或其他文字</p>
      </div>
      <button class="btn btn-primary" id="btn-generate">生成并部署</button>

      <div class="result-box" id="result-box">
        <div class="result-url" id="result-url"></div>
        <button class="btn btn-ghost" id="btn-copy">复制链接</button>
      </div>
    </div>

    <!-- 已有接口 -->
    <div class="card">
      <h2>已有接口</h2>
      <ul class="endpoint-list" id="endpoint-list">
        <li class="empty-state">加载中…</li>
      </ul>
    </div>
  </div>

  <div id="toast"></div>

    <script>
    const $ = (sel) => document.querySelector(sel);

    const fields = {
      user: $('#gh-user'),
      repo: $('#gh-repo'),
      branch: $('#gh-branch'),
      token: $('#gh-token'),
      name: $('#ep-name'),
      content: $('#ep-content'),
    };

    const STORAGE_KEY = 'api-gen-config';

    const DEFAULT_CONFIG = {
      user: 'lwei1992',
      repo: 'app-gonow',
      branch: 'main',
      token: window.LOCAL_CONFIG?.token || '',
    };

    function loadConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        fields.user.value = saved.user || DEFAULT_CONFIG.user;
        fields.repo.value = saved.repo || DEFAULT_CONFIG.repo;
        fields.branch.value = saved.branch || DEFAULT_CONFIG.branch;
        fields.token.value = saved.token || DEFAULT_CONFIG.token;
      } catch {
        fields.user.value = DEFAULT_CONFIG.user;
        fields.repo.value = DEFAULT_CONFIG.repo;
        fields.branch.value = DEFAULT_CONFIG.branch;
        fields.token.value = DEFAULT_CONFIG.token;
      }
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        user: fields.user.value.trim(),
        repo: fields.repo.value.trim(),
        branch: fields.branch.value.trim() || 'main',
        token: fields.token.value.trim(),
      }));
    }

    ['user', 'repo', 'branch', 'token'].forEach((key) => {
      fields[key].addEventListener('change', saveConfig);
      fields[key].addEventListener('input', saveConfig);
    });

    $('#toggle-token').addEventListener('click', () => {
      const input = fields.token;
      const btn = $('#toggle-token');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '隐藏';
      } else {
        input.type = 'password';
        btn.textContent = '显示';
      }
    });

    let toastTimer;
    function toast(msg, type = '') {
      const el = $('#toast');
      el.textContent = msg;
      el.className = type;
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function getConfig() {
      const user = fields.user.value.trim();
      const repo = fields.repo.value.trim();
      const branch = fields.branch.value.trim() || 'main';
      const token = fields.token.value.trim();
      if (!user || !repo || !token) {
        throw new Error('请填写 GitHub 用户名、仓库名和 Token');
      }
      return { user, repo, branch, token };
    }

    function endpointPath(name) {
      return `${name}/index.html`;
    }

    function pageUrl(user, repo, name) {
      return `https://${user}.github.io/${repo}/${name}`;
    }

    function contentsApiPath(filePath) {
      return `/contents/${filePath.split('/').map(encodeURIComponent).join('/')}`;
    }

    async function ghFetch(path, options = {}) {
      const { user, repo, token } = getConfig();
      const url = `https://api.github.com/repos/${user}/${repo}${path}`;
      const res = await fetch(url, {
        ...options,
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: `Bearer ${token}`,
          'X-GitHub-Api-Version': '2022-11-28',
          ...options.headers,
        },
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `GitHub API 错误 (${res.status})`);
      }
      return res.json();
    }

    async function getFileSha(filename) {
      try {
        const { branch } = getConfig();
        const data = await ghFetch(`${contentsApiPath(filename)}?ref=${branch}`);
        return data.sha;
      } catch {
        return null;
      }
    }

    async function uploadFile(filename, content) {
      const { branch } = getConfig();
      const sha = await getFileSha(filename);
      const body = {
        message: sha ? `Update ${filename}` : `Add ${filename}`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch,
      };
      if (sha) body.sha = sha;
      await ghFetch(contentsApiPath(filename), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    function showStatus(msg, ok) {
      const el = $('#config-status');
      el.innerHTML = `<span class="status-dot ${ok ? 'ok' : 'err'}"></span>${msg}`;
      el.classList.add('visible');
    }

    async function testConnection() {
      const btn = $('#btn-test');
      btn.disabled = true;
      try {
        getConfig();
        const me = await fetch('https://api.github.com/user', {
          headers: {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${fields.token.value.trim()}`,
            'X-GitHub-Api-Version': '2022-11-28',
          },
        }).then((r) => r.json());
        if (me.message) throw new Error(me.message);
        const { user, repo } = getConfig();
        try {
          await ghFetch('');
          showStatus(`已连接 ${me.login}，仓库 ${user}/${repo} 可访问`, true);
          toast('连接成功', 'success');
        } catch {
          showStatus(`已认证 ${me.login}，但仓库 ${user}/${repo} 不存在或无权限`, false);
          toast('Token 有效，但仓库不可访问', 'error');
        }
      } catch (e) {
        showStatus(e.message, false);
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function initDeploy() {
      const btn = $('#btn-init');
      try {
        getConfig();
      } catch (e) {
        return toast(e.message, 'error');
      }
      if (!confirm('将把 index.html 和 .nojekyll 上传到仓库，用于首次部署生成器。继续？')) return;

      btn.disabled = true;
      btn.textContent = '部署中…';
      try {
        const htmlRes = await fetch('index.html');
        if (!htmlRes.ok) throw new Error('无法读取 index.html，请确保通过网页访问本页面');
        const html = await htmlRes.text();
        await uploadFile('index.html', html);
        await uploadFile('.nojekyll', '');
        const { user, repo } = getConfig();
        const url = `https://${user}.github.io/${repo}/`;
        showStatus(`生成器已上传，访问地址：${url}（约 1-2 分钟生效）`, true);
        toast('初始化部署成功', 'success');
      } catch (e) {
        showStatus(e.message, false);
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '初始化部署生成器';
      }
    }

    function exportConfig() {
      const data = {
        user: fields.user.value.trim(),
        repo: fields.repo.value.trim(),
        branch: fields.branch.value.trim() || 'main',
        token: fields.token.value.trim(),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'config.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('配置已导出为 config.json', 'success');
    }

    function importConfig(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.user) fields.user.value = data.user;
          if (data.repo) fields.repo.value = data.repo;
          if (data.branch) fields.branch.value = data.branch;
          if (data.token) fields.token.value = data.token;
          saveConfig();
          toast('配置已导入', 'success');
        } catch {
          toast('配置文件格式错误', 'error');
        }
      };
      reader.readAsText(file);
    }

    async function deployEndpoint(name, content) {
      const path = endpointPath(name);
      const sha = await getFileSha(path);
      const body = {
        message: sha ? `Update endpoint ${name}` : `Create endpoint ${name}`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: getConfig().branch,
      };
      if (sha) body.sha = sha;
      await ghFetch(contentsApiPath(path), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      // 清理旧版无扩展名文件（会触发下载）
      const oldSha = await getFileSha(name);
      if (oldSha) {
        await ghFetch(contentsApiPath(name), {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: `Remove legacy endpoint ${name}`,
            sha: oldSha,
            branch: getConfig().branch,
          }),
        });
      }
    }

    async function deleteEndpoint(filePath, sha) {
      const { branch } = getConfig();
      await ghFetch(contentsApiPath(filePath), {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Delete endpoint ${filePath}`,
          sha,
          branch,
        }),
      });
    }

    async function listEndpoints() {
      const list = $('#endpoint-list');
      try {
        const { branch } = getConfig();
        const items = await ghFetch(`/contents/?ref=${branch}`);
        const endpoints = items.filter(
          (f) => f.type === 'dir' && !f.name.startsWith('.')
        );

        if (endpoints.length === 0) {
          list.innerHTML = '<li class="empty-state">暂无接口，请先生成一个</li>';
          return;
        }

        list.innerHTML = endpoints.map((f) => `
          <li class="endpoint-item" data-name="${f.name}">
            <div>
              <div class="endpoint-name">${f.name}</div>
              <div class="endpoint-preview" title="点击编辑可查看内容">已部署</div>
            </div>
            <div class="endpoint-actions">
              <button class="btn btn-ghost btn-edit" data-name="${f.name}">编辑</button>
              <button class="btn btn-ghost btn-copy-ep" data-name="${f.name}">复制</button>
              <button class="btn btn-danger btn-del" data-name="${f.name}">删除</button>
            </div>
          </li>
        `).join('');

        list.querySelectorAll('.btn-edit').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const name = btn.dataset.name;
            try {
              const { branch } = getConfig();
              const data = await ghFetch(`${contentsApiPath(endpointPath(name))}?ref=${branch}`);
              const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
              fields.name.value = name;
              fields.content.value = text;
              window.scrollTo({ top: 0, behavior: 'smooth' });
              toast('已加载到编辑区');
            } catch (e) {
              toast(e.message, 'error');
            }
          });
        });

        list.querySelectorAll('.btn-copy-ep').forEach((btn) => {
          btn.addEventListener('click', () => {
            const { user, repo } = getConfig();
            copyText(pageUrl(user, repo, btn.dataset.name));
          });
        });

        list.querySelectorAll('.btn-del').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const name = btn.dataset.name;
            if (!confirm(`确定删除接口「${name}」？`)) return;
            try {
              btn.disabled = true;
              const { branch } = getConfig();
              const data = await ghFetch(`${contentsApiPath(endpointPath(name))}?ref=${branch}`);
              await deleteEndpoint(endpointPath(name), data.sha);
              toast('已删除', 'success');
              await refreshList();
            } catch (e) {
              toast(e.message, 'error');
              btn.disabled = false;
            }
          });
        });
      } catch (e) {
        list.innerHTML = `<li class="empty-state">${e.message}</li>`;
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(
        () => toast('已复制到剪贴板', 'success'),
        () => toast('复制失败', 'error')
      );
    }

    async function refreshList() {
      await listEndpoints();
    }

    $('#btn-generate').addEventListener('click', async () => {
      const btn = $('#btn-generate');
      const name = fields.name.value.trim();
      const content = fields.content.value;

      if (!name) return toast('请填写名字', 'error');
      if (!/^[a-zA-Z0-9_\-.]+$/.test(name)) {
        return toast('名字只能包含字母、数字、下划线、连字符和点', 'error');
      }

      try {
        getConfig();
      } catch (e) {
        return toast(e.message, 'error');
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 部署中…';

      try {
        await deployEndpoint(name, content);
        const { user, repo } = getConfig();
        const url = pageUrl(user, repo, name);
        $('#result-url').textContent = url;
        $('#result-box').classList.add('visible');
        toast('部署成功！约 1 分钟后生效', 'success');
        await refreshList();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '生成并部署';
      }
    });

    $('#btn-copy').addEventListener('click', () => {
      copyText($('#result-url').textContent);
    });

    $('#btn-test').addEventListener('click', testConnection);
    $('#btn-init').addEventListener('click', initDeploy);
    $('#btn-export').addEventListener('click', exportConfig);
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', (e) => {
      if (e.target.files[0]) importConfig(e.target.files[0]);
      e.target.value = '';
    });

    loadConfig();
    if (fields.user.value && fields.repo.value && fields.token.value) {
      refreshList();
    } else {
      $('#endpoint-list').innerHTML = '<li class="empty-state">请先完成 GitHub 配置</li>';
    }
  </script>
</body>
</html>
