<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接口跳转生成器</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface-2: #242836;
      --border: #2e3345;
      --text: #e8eaf0;
      --text-muted: #8b92a8;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
      --success: #4ade80;
      --error: #f87171;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 0.875rem;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-field input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-field span {
      font-size: 0.9rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .btn-row .btn { flex: 1; min-width: 120px; }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--text-muted);
    }

    .status-dot.ok { background: var(--success); }
    .status-dot.err { background: var(--error); }

    .config-status {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-radius: 8px;
      display: none;
    }

    .config-status.visible { display: block; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid transparent;
      padding: 4px 10px;
      font-size: 0.8rem;
    }

    .btn-danger:hover { background: rgba(248, 113, 113, 0.1); }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      opacity: 0;
      transition: transform 0.25s, opacity 0.25s;
      z-index: 100;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #toast.success { border-color: var(--success); }
    #toast.error { border-color: var(--error); }

    .result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: var(--surface-2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .result-box.visible { display: block; }

    .result-url {
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
      font-size: 0.85rem;
      word-break: break-all;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .endpoint-list {
      list-style: none;
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    .endpoint-item:last-child { border-bottom: none; }

    .endpoint-name {
      font-weight: 600;
      font-family: "SF Mono", "Fira Code", Consolas, monospace;
    }

    .endpoint-preview {
      color: var(--text-muted);
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 320px;
    }

    .endpoint-date {
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .customer-list { list-style: none; }

    .customer-item {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    .customer-item:last-child { border-bottom: none; }

    .customer-row {
      display: grid;
      grid-template-columns: 90px 1fr 90px auto;
      gap: 8px;
      align-items: center;
    }

    .customer-row input { font-size: 0.85rem; padding: 7px 10px; }

    .customer-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .customer-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .customer-add-form {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 520px) {
      .customer-row { grid-template-columns: 1fr; }
    }

    .endpoint-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      padding: 20px 0;
    }

    .token-toggle {
      position: relative;
    }

    .token-toggle input { padding-right: 70px; }

    .token-toggle button {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .token-toggle button:hover { color: var(--text); }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .modal-close:hover { color: var(--text); background: var(--surface-2); }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-footer .btn { flex: 1; }

    .field-with-btn {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .field-with-btn .field { flex: 1; margin-bottom: 0; }

    .field-with-btn .btn { flex-shrink: 0; margin-bottom: 0; height: 42px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>接口跳转生成器</h1>
      <p>通过 GitHub Pages 部署纯文本接口，页面仅输出你指定的内容</p>
    </header>

    <!-- GitHub 配置 -->
    <div class="card">
      <h2>GitHub 配置</h2>
      <div class="row">
        <div class="field">
          <label for="gh-user">用户名</label>
          <input type="text" id="gh-user" value="lwei1992" autocomplete="off">
        </div>
        <div class="field">
          <label for="gh-repo">仓库名</label>
          <input type="text" id="gh-repo" value="app-gonow" autocomplete="off">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="gh-branch">分支</label>
          <input type="text" id="gh-branch" value="main" autocomplete="off">
          <p class="hint">GitHub Pages 通常使用 main 或 gh-pages 分支</p>
        </div>
        <div class="field token-toggle">
          <label for="gh-token">Personal Access Token</label>
          <input type="password" id="gh-token" autocomplete="off">
          <button type="button" id="toggle-token">显示</button>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-test">测试连接</button>
        <button class="btn btn-secondary" id="btn-init">初始化部署生成器</button>
        <button class="btn btn-ghost" id="btn-export">导出配置</button>
        <button class="btn btn-ghost" id="btn-import">导入配置</button>
      </div>
      <input type="file" id="import-file" accept=".json" hidden>
      <div class="config-status" id="config-status"></div>
    </div>

    <!-- 生成接口 -->
    <div class="card">
      <h2>生成接口</h2>
      <div class="field">
        <label for="ep-customer">归属客户</label>
        <div class="field-with-btn">
          <div class="field">
            <select id="ep-customer"></select>
          </div>
          <button class="btn btn-secondary" id="btn-open-customers" type="button">管理客户</button>
        </div>
        <p class="hint">每个项目必须选择归属客户</p>
      </div>
      <div class="field">
        <label for="ep-name">名字</label>
        <input type="text" id="ep-name" placeholder="hahaha" autocomplete="off">
        <p class="hint">访问地址为 /客户ID/名字/</p>
      </div>
      <div class="field">
        <label for="ep-content">显示内容</label>
        <textarea id="ep-content" placeholder="juxsne~0~https://www.baidu.com/"></textarea>
        <p class="hint">页面将仅输出此内容，不包含任何 HTML 标签或其他文字</p>
      </div>
      <label class="checkbox-field" for="ep-duplicate">
        <input type="checkbox" id="ep-duplicate">
        <span>同名字项目</span>
      </label>
      <p class="hint" style="margin-top: -8px; margin-bottom: 16px;">开启后，同名再次生成会自动创建 _v2、_v3…；关闭则更新已有项目</p>
      <button class="btn btn-primary" id="btn-generate">生成并部署</button>

      <div class="result-box" id="result-box">
        <div class="result-url" id="result-url"></div>
        <button class="btn btn-ghost" id="btn-copy">复制链接</button>
      </div>
    </div>

    <!-- 已有接口 -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h2 style="margin-bottom:0;">已有接口</h2>
        <button class="btn btn-ghost" id="btn-refresh-list">刷新</button>
      </div>
      <ul class="endpoint-list" id="endpoint-list">
        <li class="empty-state">加载中…</li>
      </ul>
    </div>
  </div>

  <div id="toast"></div>

  <!-- 客户管理弹窗 -->
  <div class="modal-overlay" id="customer-modal">
    <div class="modal">
      <div class="modal-header">
        <h2>客户列表</h2>
        <button class="modal-close" id="btn-close-customers" type="button">&times;</button>
      </div>
      <div class="modal-body">
        <ul class="customer-list" id="customer-list">
          <li class="empty-state">加载中…</li>
        </ul>
        <div class="customer-add-form">
          <p class="customer-label">新增客户</p>
          <div class="row">
            <div class="field">
              <label for="new-customer-id">客户 ID（留空随机）</label>
              <input type="text" id="new-customer-id" placeholder="8位数字" maxlength="8" autocomplete="off">
            </div>
            <div class="field">
              <label for="new-customer-name">名字</label>
              <input type="text" id="new-customer-name" placeholder="客户名称" autocomplete="off">
            </div>
          </div>
          <div class="field">
            <label for="new-customer-code">修改码</label>
            <input type="text" id="new-customer-code" value="123456" autocomplete="off">
          </div>
          <button class="btn btn-secondary" id="btn-add-customer" style="width:100%;" type="button">添加客户</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancel-customers" type="button">取消</button>
        <button class="btn btn-primary" id="btn-save-customers" type="button">保存客户</button>
      </div>
    </div>
  </div>

    <script>
    const $ = (sel) => document.querySelector(sel);

    const fields = {
      user: $('#gh-user'),
      repo: $('#gh-repo'),
      branch: $('#gh-branch'),
      token: $('#gh-token'),
      name: $('#ep-name'),
      content: $('#ep-content'),
      duplicate: $('#ep-duplicate'),
      customer: $('#ep-customer'),
    };

    const STORAGE_KEY = 'api-gen-config';
    const CUSTOMERS_FILE = 'customers.json';
    const ENDPOINTS_META_FILE = 'endpoints-meta.json';

    const DEFAULT_CUSTOMERS = [
      { id: '88214563', name: '旧老板', code: '123456' },
      { id: '73649281', name: '贷款包老板', code: '123456' },
      { id: '51928374', name: '自备号老板', code: '123456' },
    ];

    let customers = [];
    let endpointsMeta = {};

    const DEFAULT_CONFIG = {
      user: 'lwei1992',
      repo: 'app-gonow',
      branch: 'main',
      token: window.LOCAL_CONFIG?.token || '',
    };

    function loadConfig() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        fields.user.value = saved.user || DEFAULT_CONFIG.user;
        fields.repo.value = saved.repo || DEFAULT_CONFIG.repo;
        fields.branch.value = saved.branch || DEFAULT_CONFIG.branch;
        fields.token.value = saved.token || DEFAULT_CONFIG.token;
        if (saved.duplicate != null) fields.duplicate.checked = saved.duplicate;
      } catch {
        fields.user.value = DEFAULT_CONFIG.user;
        fields.repo.value = DEFAULT_CONFIG.repo;
        fields.branch.value = DEFAULT_CONFIG.branch;
        fields.token.value = DEFAULT_CONFIG.token;
      }
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        user: fields.user.value.trim(),
        repo: fields.repo.value.trim(),
        branch: fields.branch.value.trim() || 'main',
        token: fields.token.value.trim(),
        duplicate: fields.duplicate.checked,
      }));
    }

    ['user', 'repo', 'branch', 'token'].forEach((key) => {
      fields[key].addEventListener('change', saveConfig);
      fields[key].addEventListener('input', saveConfig);
    });
    fields.duplicate.addEventListener('change', saveConfig);

    $('#toggle-token').addEventListener('click', () => {
      const input = fields.token;
      const btn = $('#toggle-token');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '隐藏';
      } else {
        input.type = 'password';
        btn.textContent = '显示';
      }
    });

    let toastTimer;
    function toast(msg, type = '') {
      const el = $('#toast');
      el.textContent = msg;
      el.className = type;
      requestAnimationFrame(() => el.classList.add('show'));
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function getConfig() {
      const user = fields.user.value.trim();
      const repo = fields.repo.value.trim();
      const branch = fields.branch.value.trim() || 'main';
      const token = fields.token.value.trim();
      if (!user || !repo || !token) {
        throw new Error('请填写 GitHub 用户名、仓库名和 Token');
      }
      return { user, repo, branch, token };
    }

    function formatDate(iso) {
      if (!iso) return '未知';
      return new Date(iso).toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    }

    function formatEndpointDates(createdAt, updatedAt) {
      return `生成：${formatDate(createdAt)}　更新：${formatDate(updatedAt || createdAt)}`;
    }

    async function loadEndpointsMeta() {
      try {
        const { branch } = getConfig();
        const data = await ghFetch(`${contentsApiPath(ENDPOINTS_META_FILE)}?ref=${branch}`);
        const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        endpointsMeta = JSON.parse(text).endpoints || {};
      } catch {
        endpointsMeta = {};
      }
    }

    async function saveEndpointsMeta() {
      await uploadFile(ENDPOINTS_META_FILE, JSON.stringify({ endpoints: endpointsMeta }, null, 2));
    }

    async function recordEndpointMeta(customerId, name, isNew) {
      const key = endpointKey(customerId, name);
      const now = new Date().toISOString();
      if (isNew || !endpointsMeta[key]) {
        endpointsMeta[key] = { createdAt: now, updatedAt: now };
      } else {
        endpointsMeta[key].updatedAt = now;
      }
      await saveEndpointsMeta();
    }

    async function removeEndpointMeta(customerId, name) {
      const key = endpointKey(customerId, name);
      if (endpointsMeta[key]) {
        delete endpointsMeta[key];
        await saveEndpointsMeta();
      }
    }

    async function backfillEndpointDate(customerId, name) {
      const key = endpointKey(customerId, name);
      if (endpointsMeta[key]?.createdAt) return endpointsMeta[key].createdAt;
      try {
        const path = endpointPath(customerId, name);
        const commits = await ghFetch(`/commits?path=${encodeURIComponent(path)}&per_page=1`);
        if (commits[0]?.commit?.committer?.date) {
          const date = commits[0].commit.committer.date;
          endpointsMeta[key] = { createdAt: date, updatedAt: date };
          return date;
        }
      } catch {}
      return null;
    }

    function endpointPath(customerId, name) {
      return `${customerId}/${name}/index.html`;
    }

    function pageUrl(user, repo, customerId, name) {
      return `https://${user}.github.io/${repo}/${customerId}/${name}`;
    }

    function endpointKey(customerId, name) {
      return `${customerId}/${name}`;
    }

    function getCustomerById(id) {
      return customers.find((c) => c.id === id);
    }

    function generateCustomerId() {
      let id;
      do {
        id = String(Math.floor(10000000 + Math.random() * 90000000));
      } while (customers.some((c) => c.id === id));
      return id;
    }

    function renderCustomerSelect() {
      const sel = fields.customer;
      if (customers.length === 0) {
        sel.innerHTML = '<option value="">请先添加客户</option>';
        return;
      }
      sel.innerHTML = customers.map((c) =>
        `<option value="${c.id}">${c.name}（${c.id}）</option>`
      ).join('');
    }

    function renderCustomerList() {
      const list = $('#customer-list');
      if (customers.length === 0) {
        list.innerHTML = '<li class="empty-state">暂无客户，请添加</li>';
        return;
      }
      list.innerHTML = customers.map((c, i) => `
        <li class="customer-item" data-index="${i}">
          <div class="customer-row">
            <div>
              <div class="customer-label">客户 ID</div>
              <input type="text" class="cust-id" value="${c.id}" maxlength="8">
            </div>
            <div>
              <div class="customer-label">名字</div>
              <input type="text" class="cust-name" value="${c.name}">
            </div>
            <div>
              <div class="customer-label">修改码</div>
              <input type="text" class="cust-code" value="${c.code}">
            </div>
            <div class="endpoint-actions" style="align-self:end;">
              <button class="btn btn-danger btn-del-customer" data-index="${i}">删除</button>
            </div>
          </div>
        </li>
      `).join('');

      list.querySelectorAll('.btn-del-customer').forEach((btn) => {
        btn.onclick = () => {
          const idx = Number(btn.dataset.index);
          const c = customers[idx];
          if (!confirm(`确定删除客户「${c.name}」？`)) return;
          customers.splice(idx, 1);
          renderCustomerList();
          renderCustomerSelect();
        };
      });
    }

    function collectCustomersFromUI() {
      const items = $('#customer-list').querySelectorAll('.customer-item');
      return Array.from(items).map((item) => ({
        id: item.querySelector('.cust-id').value.trim(),
        name: item.querySelector('.cust-name').value.trim(),
        code: item.querySelector('.cust-code').value.trim() || '123456',
      }));
    }

    function validateCustomers(list) {
      const ids = new Set();
      for (const c of list) {
        if (!/^\d{8}$/.test(c.id)) throw new Error(`客户 ID「${c.id || '(空)'}」必须是8位数字`);
        if (!c.name) throw new Error('客户名字不能为空');
        if (ids.has(c.id)) throw new Error(`客户 ID「${c.id}」重复`);
        ids.add(c.id);
      }
    }

    async function loadCustomers() {
      try {
        const { branch } = getConfig();
        const data = await ghFetch(`${contentsApiPath(CUSTOMERS_FILE)}?ref=${branch}`);
        const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
        customers = JSON.parse(text).customers || [...DEFAULT_CUSTOMERS];
      } catch {
        customers = DEFAULT_CUSTOMERS.map((c) => ({ ...c }));
        try {
          await uploadFile(CUSTOMERS_FILE, JSON.stringify({ customers }, null, 2));
        } catch {}
      }
      renderCustomerList();
      renderCustomerSelect();
    }

    async function saveCustomers() {
      const list = collectCustomersFromUI();
      validateCustomers(list);
      customers = list;
      await uploadFile(CUSTOMERS_FILE, JSON.stringify({ customers }, null, 2));
      renderCustomerList();
      renderCustomerSelect();
    }

    function contentsApiPath(filePath) {
      return `/contents/${filePath.split('/').map(encodeURIComponent).join('/')}`;
    }

    async function ghFetch(path, options = {}) {
      const { user, repo, token } = getConfig();
      let url = `https://api.github.com/repos/${user}/${repo}${path}`;
      if (!options.method || options.method === 'GET') {
        url += `${path.includes('?') ? '&' : '?'}_=${Date.now()}`;
      }
      const res = await fetch(url, {
        ...options,
        cache: 'no-store',
        headers: {
          Accept: 'application/vnd.github+json',
          Authorization: `Bearer ${token}`,
          'X-GitHub-Api-Version': '2022-11-28',
          ...options.headers,
        },
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || `GitHub API 错误 (${res.status})`);
      }
      return res.json();
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function getFileSha(filename) {
      try {
        const { branch } = getConfig();
        const data = await ghFetch(`${contentsApiPath(filename)}?ref=${branch}`);
        return data.sha;
      } catch {
        return null;
      }
    }

    async function uploadFile(filename, content) {
      const { branch } = getConfig();
      const sha = await getFileSha(filename);
      const body = {
        message: sha ? `Update ${filename}` : `Add ${filename}`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch,
      };
      if (sha) body.sha = sha;
      await ghFetch(contentsApiPath(filename), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    function showStatus(msg, ok) {
      const el = $('#config-status');
      el.innerHTML = `<span class="status-dot ${ok ? 'ok' : 'err'}"></span>${msg}`;
      el.classList.add('visible');
    }

    async function testConnection() {
      const btn = $('#btn-test');
      btn.disabled = true;
      try {
        getConfig();
        const me = await fetch('https://api.github.com/user', {
          headers: {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${fields.token.value.trim()}`,
            'X-GitHub-Api-Version': '2022-11-28',
          },
        }).then((r) => r.json());
        if (me.message) throw new Error(me.message);
        const { user, repo } = getConfig();
        try {
          await ghFetch('');
          showStatus(`已连接 ${me.login}，仓库 ${user}/${repo} 可访问`, true);
          toast('连接成功', 'success');
        } catch {
          showStatus(`已认证 ${me.login}，但仓库 ${user}/${repo} 不存在或无权限`, false);
          toast('Token 有效，但仓库不可访问', 'error');
        }
      } catch (e) {
        showStatus(e.message, false);
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function initDeploy() {
      const btn = $('#btn-init');
      try {
        getConfig();
      } catch (e) {
        return toast(e.message, 'error');
      }
      if (!confirm('将把 index.html 和 .nojekyll 上传到仓库，用于首次部署生成器。继续？')) return;

      btn.disabled = true;
      btn.textContent = '部署中…';
      try {
        const htmlRes = await fetch('index.html');
        if (!htmlRes.ok) throw new Error('无法读取 index.html，请确保通过网页访问本页面');
        const html = await htmlRes.text();
        await uploadFile('index.html', html);
        await uploadFile('.nojekyll', '');
        const defaultCustomers = DEFAULT_CUSTOMERS.map((c) => ({ ...c }));
        try {
          await uploadFile(CUSTOMERS_FILE, JSON.stringify({ customers: defaultCustomers }, null, 2));
        } catch {}
        const { user, repo } = getConfig();
        const url = `https://${user}.github.io/${repo}/`;
        showStatus(`生成器已上传，访问地址：${url}（约 1-2 分钟生效）`, true);
        toast('初始化部署成功', 'success');
      } catch (e) {
        showStatus(e.message, false);
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '初始化部署生成器';
      }
    }

    function exportConfig() {
      const data = {
        user: fields.user.value.trim(),
        repo: fields.repo.value.trim(),
        branch: fields.branch.value.trim() || 'main',
        token: fields.token.value.trim(),
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'config.json';
      a.click();
      URL.revokeObjectURL(a.href);
      toast('配置已导出为 config.json', 'success');
    }

    function importConfig(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.user) fields.user.value = data.user;
          if (data.repo) fields.repo.value = data.repo;
          if (data.branch) fields.branch.value = data.branch;
          if (data.token) fields.token.value = data.token;
          saveConfig();
          toast('配置已导入', 'success');
        } catch {
          toast('配置文件格式错误', 'error');
        }
      };
      reader.readAsText(file);
    }

    async function deployEndpoint(customerId, name, content) {
      const path = endpointPath(customerId, name);
      const sha = await getFileSha(path);
      const isNew = !sha;
      const body = {
        message: sha ? `Update ${customerId}/${name}` : `Create ${customerId}/${name}`,
        content: btoa(unescape(encodeURIComponent(content))),
        branch: getConfig().branch,
      };
      if (sha) body.sha = sha;
      await ghFetch(contentsApiPath(path), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      await recordEndpointMeta(customerId, name, isNew);
      return isNew;
    }

    async function getExistingEndpointNames(customerId) {
      const { branch } = getConfig();
      try {
        const items = await ghFetch(`/contents/${encodeURIComponent(customerId)}?ref=${branch}`);
        return new Set(
          items.filter((f) => f.type === 'dir').map((f) => f.name)
        );
      } catch {
        return new Set();
      }
    }

    function resolveDeployName(baseName, existingNames, allowDuplicate) {
      if (!allowDuplicate || !existingNames.has(baseName)) {
        return baseName;
      }
      let version = 2;
      while (existingNames.has(`${baseName}_v${version}`)) {
        version++;
      }
      return `${baseName}_v${version}`;
    }

    async function deleteEndpoint(filePath, sha) {
      const { branch } = getConfig();
      await ghFetch(contentsApiPath(filePath), {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Delete endpoint ${filePath}`,
          sha,
          branch,
        }),
      });
    }

    function bindEndpointEvents() {
      const list = $('#endpoint-list');

      list.querySelectorAll('.btn-edit').forEach((btn) => {
        btn.onclick = async () => {
          const customerId = btn.dataset.customerId;
          const name = btn.dataset.name;
          try {
            const { branch } = getConfig();
            const data = await ghFetch(`${contentsApiPath(endpointPath(customerId, name))}?ref=${branch}`);
            const text = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
            fields.customer.value = customerId;
            fields.name.value = name;
            fields.content.value = text;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            toast('已加载到编辑区');
          } catch (e) {
            toast(e.message, 'error');
          }
        };
      });

      list.querySelectorAll('.btn-copy-ep').forEach((btn) => {
        btn.onclick = () => {
          const { user, repo } = getConfig();
          copyText(pageUrl(user, repo, btn.dataset.customerId, btn.dataset.name));
        };
      });

      list.querySelectorAll('.btn-del').forEach((btn) => {
        btn.onclick = async () => {
          const customerId = btn.dataset.customerId;
          const name = btn.dataset.name;
          if (!confirm(`确定删除接口「${name}」？`)) return;
          try {
            btn.disabled = true;
            const { branch } = getConfig();
            const data = await ghFetch(`${contentsApiPath(endpointPath(customerId, name))}?ref=${branch}`);
            await deleteEndpoint(endpointPath(customerId, name), data.sha);
            await removeEndpointMeta(customerId, name);
            toast('已删除', 'success');
            await refreshList();
          } catch (e) {
            toast(e.message, 'error');
            btn.disabled = false;
          }
        };
      });
    }

    function renderEndpointList(endpoints) {
      const list = $('#endpoint-list');
      if (endpoints.length === 0) {
        list.innerHTML = '<li class="empty-state">暂无接口，请先生成一个</li>';
        return;
      }

      list.innerHTML = endpoints.map((ep) => `
        <li class="endpoint-item" data-key="${endpointKey(ep.customerId, ep.name)}">
          <div>
            <div class="endpoint-name">${ep.name}</div>
            <div class="endpoint-preview">${ep.customerName}（${ep.customerId}）</div>
            <div class="endpoint-date">${formatEndpointDates(ep.createdAt, ep.updatedAt)}</div>
          </div>
          <div class="endpoint-actions">
            <button class="btn btn-ghost btn-edit" data-customer-id="${ep.customerId}" data-name="${ep.name}">编辑</button>
            <button class="btn btn-ghost btn-copy-ep" data-customer-id="${ep.customerId}" data-name="${ep.name}">复制</button>
            <button class="btn btn-danger btn-del" data-customer-id="${ep.customerId}" data-name="${ep.name}">删除</button>
          </div>
        </li>
      `).join('');

      bindEndpointEvents();
    }

    function upsertEndpointInList(customerId, name, createdAt, updatedAt) {
      const list = $('#endpoint-list');
      const key = endpointKey(customerId, name);
      const existing = list.querySelector(`[data-key="${CSS.escape(key)}"]`);
      const dateText = formatEndpointDates(createdAt, updatedAt);
      if (existing) {
        const dateEl = existing.querySelector('.endpoint-date');
        if (dateEl) dateEl.textContent = dateText;
        return;
      }

      const empty = list.querySelector('.empty-state');
      if (empty) empty.remove();

      const customer = getCustomerById(customerId);
      const li = document.createElement('li');
      li.className = 'endpoint-item';
      li.dataset.key = key;
      li.innerHTML = `
        <div>
          <div class="endpoint-name">${name}</div>
          <div class="endpoint-preview">${customer ? customer.name : customerId}（${customerId}）</div>
          <div class="endpoint-date">${dateText}</div>
        </div>
        <div class="endpoint-actions">
          <button class="btn btn-ghost btn-edit" data-customer-id="${customerId}" data-name="${name}">编辑</button>
          <button class="btn btn-ghost btn-copy-ep" data-customer-id="${customerId}" data-name="${name}">复制</button>
          <button class="btn btn-danger btn-del" data-customer-id="${customerId}" data-name="${name}">删除</button>
        </div>
      `;
      list.prepend(li);
      bindEndpointEvents();
    }

    async function listEndpoints() {
      const list = $('#endpoint-list');
      try {
        const { branch } = getConfig();
        await loadEndpointsMeta();
        const endpoints = [];
        let metaChanged = false;
        for (const c of customers) {
          try {
            const items = await ghFetch(`/contents/${encodeURIComponent(c.id)}?ref=${branch}`);
            for (const f of items.filter((x) => x.type === 'dir')) {
              const key = endpointKey(c.id, f.name);
              let createdAt = endpointsMeta[key]?.createdAt;
              let updatedAt = endpointsMeta[key]?.updatedAt;
              if (!createdAt) {
                createdAt = await backfillEndpointDate(c.id, f.name);
                if (createdAt) {
                  updatedAt = endpointsMeta[key]?.updatedAt || createdAt;
                  metaChanged = true;
                }
              }
              endpoints.push({
                customerId: c.id,
                customerName: c.name,
                name: f.name,
                createdAt,
                updatedAt: updatedAt || createdAt,
              });
            }
          } catch {}
        }
        if (metaChanged) await saveEndpointsMeta();
        endpoints.sort((a, b) => new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0));
        renderEndpointList(endpoints);
        return endpoints.map((ep) => endpointKey(ep.customerId, ep.name));
      } catch (e) {
        list.innerHTML = `<li class="empty-state">${e.message}</li>`;
        throw e;
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(
        () => toast('已复制到剪贴板', 'success'),
        () => toast('复制失败', 'error')
      );
    }

    async function refreshList(expectedKey = null) {
      const retries = expectedKey ? 4 : 1;
      for (let i = 0; i < retries; i++) {
        try {
          const keys = await listEndpoints();
          if (!expectedKey || keys.includes(expectedKey)) return;
        } catch {
          if (i === retries - 1) throw new Error('刷新列表失败');
        }
        if (i < retries - 1) await sleep(800 * (i + 1));
      }
    }

    $('#btn-generate').addEventListener('click', async () => {
      const btn = $('#btn-generate');
      const customerId = fields.customer.value;
      const baseName = fields.name.value.trim();
      const content = fields.content.value;
      const allowDuplicate = fields.duplicate.checked;

      if (!customerId) return toast('请选择归属客户', 'error');
      if (!baseName) return toast('请填写名字', 'error');
      if (!/^[a-zA-Z0-9_\-.]+$/.test(baseName)) {
        return toast('名字只能包含字母、数字、下划线、连字符和点', 'error');
      }

      const customer = getCustomerById(customerId);
      if (!customer) return toast('所选客户不存在', 'error');

      try {
        getConfig();
      } catch (e) {
        return toast(e.message, 'error');
      }

      let existingNames;
      let deployName;
      let isUpdate;
      try {
        existingNames = await getExistingEndpointNames(customerId);
        deployName = resolveDeployName(baseName, existingNames, allowDuplicate);
        isUpdate = !allowDuplicate && existingNames.has(baseName);
      } catch (e) {
        return toast(e.message, 'error');
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 部署中…';

      try {
        await deployEndpoint(customerId, deployName, content);
        const metaKey = endpointKey(customerId, deployName);
        const meta = endpointsMeta[metaKey] || {};
        upsertEndpointInList(customerId, deployName, meta.createdAt, meta.updatedAt);
        const { user, repo } = getConfig();
        const url = pageUrl(user, repo, customerId, deployName);
        $('#result-url').textContent = url;
        $('#result-box').classList.add('visible');

        if (deployName !== baseName) {
          toast(`已创建新版本：${deployName}`, 'success');
        } else if (isUpdate) {
          toast('已更新已有项目', 'success');
        } else {
          toast('部署成功！约 1 分钟后生效', 'success');
        }
        refreshList(endpointKey(customerId, deployName)).catch(() => {});
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '生成并部署';
      }
    });

    $('#btn-copy').addEventListener('click', () => {
      copyText($('#result-url').textContent);
    });

    $('#btn-test').addEventListener('click', testConnection);
    $('#btn-init').addEventListener('click', initDeploy);
    $('#btn-export').addEventListener('click', exportConfig);
    $('#btn-refresh-list').addEventListener('click', async () => {
      const btn = $('#btn-refresh-list');
      btn.disabled = true;
      btn.textContent = '刷新中…';
      try {
        await refreshList();
        toast('列表已刷新', 'success');
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '刷新';
      }
    });
    $('#btn-save-customers').addEventListener('click', async () => {
      const btn = $('#btn-save-customers');
      btn.disabled = true;
      btn.textContent = '保存中…';
      try {
        getConfig();
        await saveCustomers();
        toast('客户列表已保存', 'success');
        closeCustomerModal();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '保存客户';
      }
    });
    $('#btn-open-customers').addEventListener('click', openCustomerModal);
    $('#btn-close-customers').addEventListener('click', closeCustomerModal);
    $('#btn-cancel-customers').addEventListener('click', closeCustomerModal);
    $('#customer-modal').addEventListener('click', (e) => {
      if (e.target.id === 'customer-modal') closeCustomerModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCustomerModal();
    });

    function openCustomerModal() {
      renderCustomerList();
      $('#customer-modal').classList.add('open');
    }

    function closeCustomerModal() {
      $('#customer-modal').classList.remove('open');
    }

    $('#btn-add-customer').addEventListener('click', async () => {
      const idInput = $('#new-customer-id').value.trim();
      const name = $('#new-customer-name').value.trim();
      const code = $('#new-customer-code').value.trim() || '123456';
      if (!name) return toast('请填写客户名字', 'error');
      const id = idInput || generateCustomerId();
      if (!/^\d{8}$/.test(id)) return toast('客户 ID 必须是8位数字', 'error');
      if (customers.some((c) => c.id === id)) return toast('客户 ID 已存在', 'error');
      customers.push({ id, name, code });
      $('#new-customer-id').value = '';
      $('#new-customer-name').value = '';
      $('#new-customer-code').value = '123456';
      renderCustomerList();
      renderCustomerSelect();
      fields.customer.value = id;
      toast('已添加，记得点击「保存客户」同步到 GitHub', 'success');
    });
    $('#btn-import').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', (e) => {
      if (e.target.files[0]) importConfig(e.target.files[0]);
      e.target.value = '';
    });

    loadConfig();
    async function initApp() {
      if (!fields.user.value || !fields.repo.value || !fields.token.value) {
        $('#endpoint-list').innerHTML = '<li class="empty-state">请先完成 GitHub 配置</li>';
        return;
      }
      try {
        await loadCustomers();
        await refreshList();
      } catch (e) {
        $('#endpoint-list').innerHTML = `<li class="empty-state">${e.message}</li>`;
      }
    }
    initApp();
  </script>
</body>
</html>
